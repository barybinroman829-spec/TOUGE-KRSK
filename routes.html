<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOUGE KRSK — Маршруты</title>
    <link href="https://cdn.jsdelivr.net/npm/fontsource-roboto@3.0.3/index.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/fontsource-orbitron@4.0.0/index.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <!-- Loader, Canvas, Notification, Navbar (как в accounts.html, но class="active" на "Маршруты") -->
    <div class="loader" id="loader"><div class="loader-text">TOUGE KRSK</div><div class="loader-bar"><div class="loader-fill"></div></div></div>
    <canvas id="speedCanvas"></canvas>
    <div class="notification" id="notification"><div class="notification-title" id="notifTitle"></div><div class="notification-text" id="notifText"></div></div>
    <nav class="navbar" id="navbar">
        <a href="index.html" class="nav-logo">TOUGE <span>KRSK</span></a>
        <button class="mobile-menu-btn" onclick="document.getElementById('navLinks').classList.toggle('active')"><span></span><span></span><span></span></button>
        <ul class="nav-links" id="navLinks">
            <li><a href="index.html">Главная</a></li><li><a href="accounts.html">Аккаунты</a></li><li><a href="routes.html" class="active">Маршруты</a></li><li><a href="places.html">Места</a></li>
        </ul>
    </nav>

    <div class="page active">
        <section class="section" style="padding-top:120px">
            <div class="section-header reveal">
                <h2>МАРШРУТЫ <span>ГОНЩИКОВ</span></h2><div class="divider"></div><p class="sub">レーシングルート</p>
            </div>
            <div class="routes-container" id="routesList"></div>
            
            <div class="add-section reveal">
                <h3>ДОБАВИТЬ <span>МАРШРУТ</span></h3>
                <form id="routeForm" onsubmit="addRoute(event)">
                    <div class="form-group"><label class="form-label">Название</label><input class="form-input" id="routeName" required></div>
                    <div class="form-row">
                        <div class="form-group"><label class="form-label">Гонщик</label><select class="form-select" id="routeDriver" required><option value="">Выберите</option></select></div>
                        <div class="form-group"><label class="form-label">Тип</label><select class="form-select" id="routeType" required><option value="downhill">Даунхилл</option><option value="uphill">Апхилл</option><option value="touge">Тогэ</option></select></div>
                    </div>
                    <div class="form-row">
                        <div class="form-group"><label class="form-label">Старт</label><input class="form-input" id="routeStart" required></div>
                        <div class="form-group"><label class="form-label">Финиш</label><input class="form-input" id="routeEnd" required></div>
                    </div>
                    <div class="form-group"><label class="form-label">Длина (км)</label><input class="form-input" type="number" step="0.1" id="routeLength" required></div>
                    <div class="form-group"><label class="form-label">Описание</label><textarea class="form-textarea" id="routeDesc"></textarea></div>
                    <div class="form-group"><label class="form-label">Сложность</label><select class="form-select" id="routeDifficulty" required><option value="easy">Лёгкий</option><option value="medium">Средний</option><option value="hard">Сложный</option><option value="extreme">Экстремальный</option></select></div>
                    <button type="submit" class="form-submit">Добавить маршрут</button>
                </form>
            </div>
        </section>
    </div>

    <!-- Footer (как в accounts.html) -->
    <footer class="footer"><div class="footer-bottom"><p>© 2024 TOUGE KRSK</p></div></footer>
    <script src="assets/js/main.js"></script>
</body>
</html>
